services:
  app:
    build: .
    container_name: recc-engine
    env_file:
      - .env
    environment:
      USER_PROFILE_DB_PATH: data/user_profiles.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma:/app/chroma
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
